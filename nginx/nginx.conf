# ============================================================================
# StudyKeeper 本地站点配置
#
# 这个文件被 compose 挂载成容器里的 /etc/nginx/conf.d/default.conf，
# 所以它写的是 **server 块**（站点级配置），不是带 events/http 的完整 nginx.conf。
#
# 分工：
#   1. 静态文件：前端 dist 就在镜像的 /usr/share/nginx/html（由前端 Dockerfile 构建时拷进去）；
#   2. /api     ：反向代理到内网的 backend:8080（Java）。前端 axios 的 baseURL 是相对路径 /api，
#                  开发时靠 vite devServer 代理，线上就靠这里 —— 所以跨域问题不存在，也不用配 CORS。
#
# 只监听 80、不做 HTTPS（本地测试用）。
# ============================================================================

server {
    listen       80;
    server_name  localhost;

    # 头像走 base64（后端上限 500KB），请求体留 10m 余量，别让 nginx 先拦掉
    client_max_body_size 10m;

    root  /usr/share/nginx/html;
    index index.html;

    # 带 hash 的构建产物：可以放心长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # 前端静态文件。Vue Router 用 history 模式，刷新 /task 这类深链接会 404，
    # 所以找不到文件时统一回 index.html，由前端路由自己处理。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口：/api/xxx → http://backend:8080/api/xxx
    # 注意 proxy_pass 末尾不带路径，所以 URI 原样透传（不会把 /api 剥掉）。
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 空 Connection = 不让 nginx 强制 close，SSE 长连接才不会被掐断
        proxy_set_header Connection        "";

        # /api/ai/chat/stream 是 text/event-stream（SSE）：
        # 必须关掉响应缓冲，否则 nginx 会攒够一块才吐给浏览器，前端就变成「聊完一次性出现」
        proxy_buffering off;
        proxy_cache     off;

        # AI 对话最长可能跑几十秒（后端 ai.service.timeout = 30s），给足超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
