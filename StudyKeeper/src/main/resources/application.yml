server:
  port: 8080

spring:
  datasource:
    # 默认值 = 本机直连（本地开发照旧，不用配任何环境变量）；
    # Docker 里由 docker-compose.yml 传 SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD 覆盖，
    # 那时候主机名是容器名 mysql，不是 localhost。
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/study_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 邮件发送（QQ 邮箱 SMTP）：username 是你的 QQ 邮箱地址，password 是 QQ 邮箱的「授权码」（不是登录密码）。
  # 两个值都从环境变量读，不写死在仓库里：本地跑之前先设 MAIL_USERNAME / MAIL_PASSWORD。
  # 没配置时应用照样能启动（JavaMailSender 仍会被创建），只是发验证码接口会返回 400「邮件发送失败，请稍后再试」。
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  # HS256 要求密钥至少 32 字节；改这里会让所有已签发的 token 立即失效。
  # 冒号后面是本机默认值（本地开发照旧）；Docker 里由 compose 传 JWT_SECRET 覆盖。
  secret: ${JWT_SECRET:your-secret-key-at-least-32-characters-long}
  # token 有效期：7 天（毫秒）
  expiration: 604800000

ai:
  service:
    # Python AI 服务地址（StudyKeeper-ai，FastAPI，默认监听 8000）
    # 默认值是本机直连；Docker 里由 compose 传 AI_SERVICE_BASE_URL=http://ai:8000
    # （容器之间必须用容器名，localhost 指的是容器自己）
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    # 连接 / 读取超时，单位毫秒
    timeout: 30000

app:
  email:
    # 验证码有效期：300 秒 = 5 分钟
    code-expire-seconds: 300
    # 同一个邮箱多少秒内不能重复发（防刷）：60 秒
    send-interval-seconds: 60
