<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习监督 · 道奇蓝按钮</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #fafafa;
            --surface: #ffffff;
            --border: #e5e5e5;
            --border-strong: #d4d4d4;
            --text: #171717;
            --text-secondary: #525252;
            --text-muted: #a3a3a3;
            --hover: #f5f5f5;
            --accent: #5e6ad2;
            --accent-hover: #4f5ac0;
            --accent-soft: #eef0fb;
            --danger: #dc2626;
            --success: #16a34a;
            /* 用户气泡蓝色 */
            --user-bubble-bg: #0ea5e9;
            /* 道奇蓝 */
            --dodger-blue: #1E90FF;
            --dodger-blue-hover: #1a7fd4;
            --dodger-blue-active: #166bb3;
        }

        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
        }

        .app-container {
            max-width: 960px;
            width: 100%;
            background: var(--surface);
            border-radius: 8px;
            border: 1px solid var(--border);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
            padding: 24px 28px 28px 28px;
            box-sizing: border-box;
        }

        /* 通用按钮样式（非主要按钮保持中性，但我们会覆盖主要按钮） */
        button, .btn, .nav-link, .tab-item, [data-clickable] {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 7px 14px;
            font-size: 0.8125rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
            outline: none;
            font-family: inherit;
        }

        button:hover, .btn:hover, .nav-link:hover, .tab-item:hover, [data-clickable]:hover {
            background: var(--hover);
            border-color: var(--border-strong);
        }

        button:active, .btn:active {
            background: #ededed;
        }

        button:focus-visible, .btn:focus-visible, .nav-link:focus-visible,
        .tab-item:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
            box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent);
        }

        .nav-link {
            background: transparent;
            border: none;
            padding: 6px 12px;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.8125rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            border-radius: 6px;
        }

        .nav-link:hover {
            background: var(--hover);
            color: var(--text);
        }

        .nav-link.active {
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 600;
        }

        .nav-link.active:hover {
            background: #e6e9f8;
            color: var(--accent);
        }

        /* ===== 道奇蓝按钮 ===== */
        .btn-primary {
            background: var(--dodger-blue);
            border: 1px solid var(--dodger-blue);
            color: #ffffff;
            font-weight: 500;
        }

        .btn-primary:hover {
            background: var(--dodger-blue-hover);
            border-color: var(--dodger-blue-hover);
        }

        .btn-primary:active {
            background: var(--dodger-blue-active);
            border-color: var(--dodger-blue-active);
        }

        /* 带魔法图标的按钮也统一为道奇蓝，但保留白色文字 */
        .btn-magic {
            background: var(--dodger-blue);
            border: 1px solid var(--dodger-blue);
            color: #ffffff;
            font-weight: 500;
        }
        .btn-magic:hover {
            background: var(--dodger-blue-hover);
            border-color: var(--dodger-blue-hover);
        }

        /* 所有带 data-page 的按钮如果是主操作也继承 */
        .dialog-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.32);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.15s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .dialog-box {
            background: var(--surface);
            border-radius: 8px;
            padding: 24px;
            width: 460px;
            max-width: 90vw;
            box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            animation: slideUp 0.15s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            height: 160px;
            padding: 8px 0;
        }

        .bar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .bar-fill {
            width: 100%;
            background: #d4d4d4;
            height: 0;
            border-radius: 3px 3px 0 0;
            transition: height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bar-item:hover .bar-fill {
            background: var(--accent);
        }

        .bar-label {
            font-size: 0.75rem;
            margin-top: 8px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .task-item, .long-task-item {
            border-bottom: 1px solid var(--border);
            padding: 14px 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            transition: background 0.12s ease;
        }

        .task-item:hover, .long-task-item:hover {
            background: #fafafa;
        }

        .task-item:last-child, .long-task-item:last-child {
            border-bottom: none;
        }

        .status-badge {
            font-size: 0.6875rem;
            font-weight: 500;
            border: 1px solid var(--border);
            padding: 3px 10px;
            background: var(--surface);
            color: var(--text-secondary);
            border-radius: 20px;
            display: inline-block;
        }

        .status-badge.done {
            background: #f0fdf4;
            color: var(--success);
            border-color: #bbf7d0;
        }

        /* ===== 消息气泡 ===== */
        .message-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            background: var(--surface);
            margin-bottom: 10px;
            border-radius: 8px;
            line-height: 1.55;
        }

        .message-user {
            margin-left: auto;
            background: var(--user-bubble-bg);
            color: #ffffff;
            border-color: var(--user-bubble-bg);
        }

        .message-user .text-xs {
            color: rgba(255, 255, 255, 0.8) !important;
        }

        .message-ai {
            margin-right: auto;
            background: var(--surface);
        }

        input[type="text"], input[type="password"], select, textarea {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 0.8125rem;
            transition: border-color 0.12s ease, box-shadow 0.12s ease;
            background: var(--surface);
            color: var(--text);
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
        }

        input::placeholder, textarea::placeholder {
            color: var(--text-muted);
        }

        textarea {
            resize: vertical;
            min-height: 96px;
            line-height: 1.6;
        }

        input[type="text"]:focus, input[type="password"]:focus, select:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(94, 106, 210, 0.12);
            outline: none;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 18px 20px;
        }

        input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        .text-gradient {
            color: var(--text);
            background: none;
            -webkit-text-fill-color: var(--text);
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a3a3a3; }

        .fade-in { animation: fadeInUp 0.25s ease; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .weekday-btn {
            border: 1px solid var(--border);
            padding: 5px 14px;
            font-size: 0.75rem;
            font-weight: 500;
            border-radius: 6px;
            background: var(--surface);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.12s ease;
        }

        .weekday-btn:hover {
            background: var(--hover);
        }

        .weekday-btn.active {
            background: var(--accent-soft);
            color: var(--accent);
            border-color: #c7cdf0;
            font-weight: 600;
        }

        .tab-item {
            border: none;
            background: transparent;
            padding: 8px 14px;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-secondary);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.12s ease;
        }

        .tab-item:hover {
            background: var(--hover);
            color: var(--text);
        }

        .tab-item.active {
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 600;
        }

        .icon-circle {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            color: var(--text-secondary);
            font-size: 1rem;
            border: 1px solid var(--border);
        }

        .icon-circle.sun { background: #f5f5f5; color: var(--text-secondary); }
        .icon-circle.calendar { background: #f5f5f5; color: var(--text-secondary); }
        .icon-circle.chart { background: #f5f5f5; color: var(--text-secondary); }

        .border-slate-100 { border-color: var(--border); }
        .text-indigo-600 { color: var(--accent); }

        .ai-task-preview {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 6px;
            background: var(--surface);
            border: 1px solid var(--border);
        }

        .ai-task-index {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6875rem;
            font-weight: 600;
            background: #f5f5f5;
            color: var(--text-secondary);
            flex-shrink: 0;
            border: 1px solid var(--border);
        }

        .empty-plan-tip {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 8px;
            cursor: pointer;
            background: var(--surface);
            border: 1px dashed var(--border-strong);
            transition: all 0.15s ease;
        }

        .empty-plan-tip:hover {
            background: #fafafa;
            border-color: var(--accent);
        }

        .time-select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a3a3a3' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 14px;
            padding: 8px 26px 8px 12px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
        }

        /* 课程表网格 */
        .timetable-grid-container {
            height: 600px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
        }

        .timetable-header {
            display: flex;
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .timetable-header-day {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            border-right: 1px solid var(--border);
        }

        .timetable-header-day:last-child { border-right: none; }

        .timetable-body {
            display: flex;
            position: relative;
        }

        .timetable-time-col {
            width: 60px;
            flex-shrink: 0;
            border-right: 1px solid var(--border);
            background: var(--surface);
            position: relative;
            z-index: 2;
        }

        .timetable-time-label {
            height: 60px;
            font-size: 0.6875rem;
            color: var(--text-muted);
            text-align: center;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 6px;
            box-sizing: border-box;
            font-variant-numeric: tabular-nums;
        }

        .timetable-grid-bg {
            flex: 1;
            position: relative;
            background-image: repeating-linear-gradient(to bottom, transparent, transparent 59px, #f5f5f5 59px, #f5f5f5 60px);
        }

        .course-block {
            position: absolute;
            border-radius: 4px;
            padding: 6px 4px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: filter 0.12s ease;
        }

        .course-block:hover {
            filter: brightness(0.97);
            z-index: 5;
        }

        .course-block-inner {
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 1px;
            font-size: 0.6875rem;
            font-weight: 500;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            width: 100%;
            height: 100%;
            text-align: center;
            line-height: 1.3;
            word-break: break-all;
        }

        .course-delete-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid var(--border);
            border-radius: 4px;
            width: 16px;
            height: 16px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--danger);
            opacity: 0;
            transition: opacity 0.12s ease;
            z-index: 10;
            padding: 0;
        }

        .course-block:hover .course-delete-btn { opacity: 1; }

        /* 用户下拉菜单 */
        .user-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 8px 10px;
            font-size: 0.8125rem;
            color: var(--text);
            background: transparent;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: left;
            transition: background 0.1s ease;
            font-weight: 500;
            font-family: inherit;
            box-sizing: border-box;
        }

        .user-menu-item:hover {
            background: var(--hover);
        }

        .user-menu-item.user-menu-danger { color: var(--danger); }
        .user-menu-item.user-menu-danger:hover { background: #fef2f2; }

        .avatar-option {
            transition: all 0.12s ease;
            font-family: inherit;
            padding: 0;
        }

        .avatar-option:hover {
            border-color: var(--accent) !important;
        }

        /* 首字母头像 */
        .avatar-initial {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--text);
            color: #ffffff;
            font-weight: 600;
            font-size: 0.875rem;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>

<div id="app" class="app-container fade-in">
    <div id="page-container"></div>
</div>

<script>
    // ==================== 用户资料（localStorage） ====================
    const STORAGE_KEY = 'study_user_profile_v1';

    const DEFAULT_AVATARS = ['🎓', '📚', '✏️', '🌟', '🚀', '🎯', '🎨', '🦊', '🐼', '🐧'];

    let userProfile = {
        avatar: '🎓',
        nickname: '学习同学',
        username: 'student',
        phone: '',
        email: '',
        notifications: {
            taskReminder: true,
            courseReminder: true,
            dailyReport: false,
            sound: true
        },
        feedbacks: []
    };

    function loadUserProfile() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const parsed = JSON.parse(saved);
                userProfile = Object.assign({}, userProfile, parsed);
                userProfile.notifications = Object.assign(
                    { taskReminder: true, courseReminder: true, dailyReport: false, sound: true },
                    parsed.notifications || {}
                );
                if (!Array.isArray(userProfile.feedbacks)) userProfile.feedbacks = [];
            }
        } catch (e) { console.warn('加载用户资料失败', e); }
    }

    function saveUserProfile() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(userProfile));
        } catch (e) {
            console.warn('保存用户资料失败', e);
            alert('保存失败：可能是头像图片过大，请换一张小图。');
        }
    }

    // ==================== 动态日期工具 ====================
    function getTodayString() {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth() + 1;
        const date = now.getDate();
        const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        return `${year}年${month}月${date}日 ${weekdays[now.getDay()]}`;
    }

    function getTodayWeekdayCN() {
        const map = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        return map[new Date().getDay()];
    }

    // ==================== 时间下拉框 ====================
    function buildHourOptions(selectedHour) {
        let html = '';
        for (let h = 0; h < 24; h++) {
            const hv = String(h).padStart(2, '0');
            html += `<option value="${hv}" ${hv === selectedHour ? 'selected' : ''}>${hv}</option>`;
        }
        return html;
    }

    function buildMinuteOptions(selectedMinute) {
        let html = '';
        for (let m = 0; m < 60; m += 5) {
            const mv = String(m).padStart(2, '0');
            html += `<option value="${mv}" ${mv === selectedMinute ? 'selected' : ''}>${mv}</option>`;
        }
        return html;
    }

    // ==================== 时段解析与时长计算 ====================
    function parseTimeRange(timeStr) {
        if (!timeStr) return null;
        const m = String(timeStr).match(/^\s*(\d{1,2}):(\d{2})\s*[-~至到]\s*(\d{1,2}):(\d{2})\s*$/);
        if (!m) return null;
        return {
            start: m[1].padStart(2, '0') + ':' + m[2],
            end: m[3].padStart(2, '0') + ':' + m[4]
        };
    }

    function calcDuration(start, end) {
        if (!start || !end) return '时长待定';
        const [sh, sm] = start.split(':').map(Number);
        const [eh, em] = end.split(':').map(Number);
        let totalMin = (eh * 60 + em) - (sh * 60 + sm);
        if (totalMin <= 0) return '时长待定';
        const h = Math.floor(totalMin / 60);
        const m = totalMin % 60;
        if (h === 0) return m + '分钟';
        if (m === 0) return h + '小时';
        return h + '小时' + m + '分钟';
    }

    function getDurationFromTime(timeStr) {
        const parsed = parseTimeRange(timeStr);
        if (!parsed) return '时长待定';
        return calcDuration(parsed.start, parsed.end);
    }

    // ==================== 课程表解析与颜色分配 ====================
    function parseTimetable() {
        const parsed = [];
        const dayNames = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
        dayNames.forEach((day, dayIndex) => {
            const courses = timetable[day] || [];
            courses.forEach(courseStr => {
                const match = courseStr.match(/^(.*?)\s*(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);
                if (match) {
                    const title = match[1].trim();
                    const startH = parseInt(match[2], 10);
                    const startM = parseInt(match[3], 10);
                    const endH = parseInt(match[4], 10);
                    const endM = parseInt(match[5], 10);
                    const startMin = startH * 60 + startM;
                    const endMin = endH * 60 + endM;
                    parsed.push({
                        day, dayIndex, title,
                        startTime: `${match[2].padStart(2, '0')}:${match[3]}`,
                        endTime: `${match[4].padStart(2, '0')}:${match[5]}`,
                        startMin, endMin, durationMin: endMin - startMin
                    });
                }
            });
        });
        return parsed;
    }

    const COURSE_COLORS = [
        { bg: '#eef0fb', border: '#dde1f5', text: '#3f4a9e' },
        { bg: '#e8ebfa', border: '#d5daf2', text: '#3a4590' },
        { bg: '#e2e6f8', border: '#ccd3ef', text: '#354080' },
        { bg: '#dde1f6', border: '#c5cdec', text: '#303a72' },
        { bg: '#d8ddf4', border: '#bdc6e8', text: '#2b3465' },

    // ---------- 设置页 ----------
    function renderSettings() {
        let tabContent = '';

        if (currentTab === '课程表') {
            const parsedCourses = parseTimetable();

            let minStartMin = 8 * 60;
            let maxEndMin = 22 * 60;
            parsedCourses.forEach(c => {
                if (c.startMin < minStartMin) minStartMin = c.startMin;
                if (c.endMin > maxEndMin) maxEndMin = c.endMin;
            });
            const startHour = Math.floor(minStartMin / 60);
            const endHour = Math.ceil(maxEndMin / 60);
            const totalMinutes = (endHour - startHour) * 60;
            const hourHeight = 60;
            const gridHeight = (totalMinutes / 60) * hourHeight;

            const weekdays = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

            let headerHtml = '';
            weekdays.forEach(day => {
                headerHtml += `<div class="timetable-header-day">${day}</div>`;
            });

            let timeLabelsHtml = '';
            for (let h = startHour; h < endHour; h++) {
                timeLabelsHtml += `<div class="timetable-time-label">${String(h).padStart(2, '0')}:00</div>`;
            }

            let courseBlocksHtml = '';
            parsedCourses.forEach(c => {
                const color = getCourseColor(c.title);
                const top = (c.startMin - startHour * 60) + 'px';
                const height = c.durationMin + 'px';
                const left = `calc(${c.dayIndex} * 14.285% + 2px)`;
                const width = `calc(14.285% - 4px)`;

                courseBlocksHtml += `
                    <div class="course-block" style="
                        top: ${top};
                        height: ${height};
                        left: ${left};
                        width: ${width};
                        background: ${color.bg};
                        border: 1px solid ${color.border};
                        color: ${color.text};
                    ">
                        <button class="course-delete-btn delete-course-btn" 
                                data-day="${c.day}" 
                                data-course="${c.title} ${c.startTime}-${c.endTime}"
                                title="删除课程">×</button>
                        <div class="course-block-inner">${c.title}</div>
                    </div>
                `;
            });

            const aiTip = `<div class="text-xs p-3 rounded-md mb-4 flex items-center gap-2" style="background:#fafafa; color:var(--text-secondary); border: 1px solid var(--border);">
                <i class="fa-solid fa-lightbulb" style="color:var(--text-muted);"></i> 您可以直接告诉 AI 助手帮您添加或修改课表
            </div>`;

            tabContent = `

                    ${aiTip}

                        <div class="timetable-header">

                        </div>
                        <div class="timetable-body" style="height: ${gridHeight}px;">
                            <div class="timetable-time-col">
                                ${timeLabelsHtml}
                            </div>
                            <div class="timetable-grid-bg">
                                ${courseBlocksHtml}
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button id="addCourseBtn" class="btn-primary px-4 py-2 text-sm font-medium" style="border-radius:6px;">
                            <i class="fa-solid fa-plus mr-1.5"></i> 新增课程
                        </button>
                        <button id="aiAddCourseBtn" class="px-4 py-2 text-sm font-medium" style="border-radius:6px;">
                            <i class="fa-solid fa-wand-magic-sparkles mr-1.5"></i> AI 帮我加
                        </button>
                    </div>
                </div>
            `;
        } else if (currentTab === '休息时间') {
            let breakList = breaks.map(b => `
                <div class="flex justify-between items-center border-b py-3 last:border-0" style="border-color:var(--border);">

    // ==================== 课程解析 ====================
    function parseCourseFromText(text) {
        if (!text) return null;
        const weekdayMap = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '日': 7, '天': 7 };
        const weekdayMatches = text.match(/周[一二三四五六日天]/g) || [];
        let weekdays = [];
        weekdayMatches.forEach(m => {
            const ch = m[1];
            if (weekdayMap[ch]) weekdays.push(weekdayMap[ch]);
        });
        const rangeMatch = text.match(/周([一二三四五六日天]+)/);
        if (rangeMatch) {
            const chars = rangeMatch[1];
            const newDays = [];
            for (let ch of chars) {
                if (weekdayMap[ch]) newDays.push(weekdayMap[ch]);
            }
            if (newDays.length > 0) weekdays = newDays;
        }
        weekdays = [...new Set(weekdays)];
        if (weekdays.length === 0) return null;

        let start = null, end = null;
        const timeRange1 = text.match(/(\d{1,2}):(\d{2})\s*[-到至~]\s*(\d{1,2}):(\d{2})/);
        if (timeRange1) {
            start = timeRange1[1].padStart(2, '0') + ':' + timeRange1[2];
            end = timeRange1[3].padStart(2, '0') + ':' + timeRange1[4];
        } else {
            const timeRange2 = text.match(/(\d{1,2})点\s*[-到至]?\s*(\d{1,2})?点?(\d{1,2})?分?/);
            if (timeRange2) {
                start = timeRange2[1].padStart(2, '0') + ':00';
                if (timeRange2[2]) {
                    end = timeRange2[2].padStart(2, '0') + ':00';
                    if (timeRange2[3]) {
                        end = timeRange2[2].padStart(2, '0') + ':' + timeRange2[3].padStart(2, '0');
                    }
                }
            }
        }
        if (start && !end) {
            const [h, m] = start.split(':').map(Number);
            const endHour = h + 1;
            end = String(endHour).padStart(2, '0') + ':' + String(m).padStart(2, '0');
        }

        let courseName = text
            .replace(/每周?[一二三四五六日天]+/g, '')
            .replace(/\d{1,2}:\d{2}/g, '')
            .replace(/\d{1,2}点(\d{1,2}分?)?/g, '')
            .replace(/[-到至~]/g, ' ')
            .trim();
        if (!courseName) courseName = '未命名课程';

        return {
            weekdays,
            start: start || '08:00',
            end: end || '09:40',
            title: courseName
        };
    }

    function addParsedCourseToTimetable(parsed) {
        const { weekdays, start, end, title } = parsed;
        const weekNames = ['一', '二', '三', '四', '五', '六', '日'];
        let addedDays = [];
        weekdays.forEach(d => {
            const dayKey = '周' + weekNames[d - 1];
            if (!timetable[dayKey]) timetable[dayKey] = [];
            const courseStr = `${title} ${start}-${end}`;
            if (!timetable[dayKey].includes(courseStr)) {
                timetable[dayKey].push(courseStr);
                addedDays.push(dayKey);
            }
        });
        return addedDays;
    }

            });
        });

        document.querySelectorAll('.toggle-enable').forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {

        if (sendBtn) {
            sendBtn.addEventListener('click', () => {
                const input = document.getElementById('chatInput');
                const text = input.value.trim();
                if (!text) return;

                chatMessages.push({ role: 'user', text });

                const parsed = parseCourseFromText(text);
                if (parsed) {
                    const addedDays = addParsedCourseToTimetable(parsed);
                    if (addedDays.length > 0) {
                        const weekNames = ['一', '二', '三', '四', '五', '六', '日'];
                        const dayStr = parsed.weekdays.map(d => '周' + weekNames[d-1]).join('、');
                        chatMessages.push({
                            role: 'ai',
                            text: `已为你添加课程：${parsed.title} ${parsed.start}-${parsed.end}（${dayStr}）`
                        });
                    } else {
                        chatMessages.push({ role: 'ai', text: '该课程已存在，未重复添加。' });
                    }
                } else if (text.includes('背单词') || text.includes('任务')) {
                    todayTasks.push({
                        id: Date.now(),
                        title: '背单词 30 分钟',
                        time: '时间待定',

                    });
                    chatMessages.push({ role: 'ai', text: '已为你添加任务：背单词 30 分钟，点击上方「今日任务」查看。' });
                } else {
                    chatMessages.push({ role: 'ai', text: '收到，我会继续监督你。你可以说“每周一三五 8:00-9:40 高等数学”来导入课程。' });
                }

                input.value = '';
                render();
            });
        }

        document.querySelectorAll('.tab-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tab = e.target.closest('button').getAttribute('data-tab');
                if (tab) {
                    currentTab = tab;
                    if (tab === '课程表') selectedWeekday = getTodayWeekdayCN();
                    render();
                }
            });
        });

        document.querySelectorAll('.weekday-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const day = e.target.closest('button').getAttribute('data-day');
                if (day) { selectedWeekday = day; render(); }
            });
        });

        const addCourseBtn = document.getElementById('addCourseBtn');
        if (addCourseBtn) addCourseBtn.addEventListener('click', () => showAddCourseDialog());

        const aiAddCourseBtn = document.getElementById('aiAddCourseBtn');
        if (aiAddCourseBtn) aiAddCourseBtn.addEventListener('click', () => showAiAddCourseDialog());

        document.querySelectorAll('.delete-course-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const day = e.target.closest('button').getAttribute('data-day');
                const courseStr = e.target.closest('button').getAttribute('data-course');
                if (timetable[day]) {
                    const idx = timetable[day].indexOf(courseStr);
                    if (idx !== -1) { timetable[day].splice(idx, 1); render(); }
                }
            });
        });

        const addBreakBtn = document.getElementById('addBreakBtn');
        if (addBreakBtn) {
            addBreakBtn.addEventListener('click', () => {
                breaks.push({ id: Date.now(), start: '12:00', end: '13:00' });
                render();
            });
        }

        document.querySelectorAll('.edit-break-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = parseInt(e.target.closest('button').getAttribute('data-id'), 10);
                const b = breaks.find(item => item.id === id);
                if (b) {
                    b.start = prompt('修改开始时间', b.start) || b.start;
                    b.end = prompt('修改结束时间', b.end) || b.end;
                    render();
                }
            });
        });

        document.querySelectorAll('.delete-break-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = parseInt(e.target.closest('button').getAttribute('data-id'), 10);
                breaks = breaks.filter(item => item.id !== id);
                render();
            });
        });
    }

                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1.5" style="color:var(--text-secondary);">时长（如 30分钟）</label>
                        <input id="dialogDuration" type="text" value="${task.duration}">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1.5" style="color:var(--text-secondary);">重复日</label>
                        <div class="flex flex-wrap gap-1">${repeatCheckboxes}</div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1.5" style="color:var(--text-secondary);">优先级</label>
                        <select id="dialogPriority">
                            <option value="高">高</option>
                            <option value="中" selected>中</option>
                            <option value="低">低</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end gap-3 mt-7">
                    <button id="dialogCancelBtn" class="px-4 py-2 text-sm font-medium" style="border-radius:6px;">取消</button>
                    <button id="dialogSaveBtn" class="btn-primary px-4 py-2 text-sm font-medium" style="border-radius:6px;">保存</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);

        document.getElementById('dialogCancelBtn').addEventListener('click', () => {
            overlay.remove();
            editingLongTask = null;
        });
        document.getElementById('dialogSaveBtn').addEventListener('click', () => {
            const title = document.getElementById('dialogTitle').value.trim();
            const duration = document.getElementById('dialogDuration').value.trim();
            const repeat = Array.from(document.querySelectorAll('.repeat-checkbox:checked')).map(cb => parseInt(cb.value, 10));

            if (!title || !duration) { alert('请填写标题和时长'); return; }

            if (editingLongTask) {
                const idx = longTasks.findIndex(t => t.id === editingLongTask.id);
                if (idx !== -1) longTasks[idx] = { ...longTasks[idx], title, duration, repeat };
            } else {
                longTasks.push({ id: Date.now(), title, duration, repeat, enabled: true });
            }
            overlay.remove();
            editingLongTask = null;
            render();
        });
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                overlay.remove();
                editingLongTask = null;
            }
        });
    }

    // ==================== 初始化 ====================
    loadUserProfile();
    render();
</script>

</body>
</html>
